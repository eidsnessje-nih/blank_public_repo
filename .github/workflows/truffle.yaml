on:
  push:
    branches:
    - main

env:
  HEAD: main

jobs:
  sscan:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v6

    - name: PWD
      shell: bash
      run: |
        pwd;

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      # uses: trufflesecurity/trufflehog@main
      with:
        path: .
        base: main
        extra_args: --results=verified,unknown

    - name: Pretend we did a notification
      shell: bash
      run: |
        echo "Note that this information has gone nowhere"
