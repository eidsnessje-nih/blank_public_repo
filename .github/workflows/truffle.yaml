on:
  push:
    branches:
    - main

jobs:
  sscan:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v6

    - name: PWD
      shell: bash
      run: |
        pwd;
        echo "$GITHUB_WORKSPACE";
        find . -type f -print0 | xargs -0 sha256sum > /tmp/before.out

    # One of these will work
    - name: TruffleHog Help A
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --help

    - name: TruffleHog Help B
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: ""

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: "$PWD"
        base: ${{ github.ref_name }}~1
        extra_args: filesystem --path=.  --log-level=2 --results=verified,unknown

    - name: Pretend we did a notification
      shell: bash
      run: |
        find . -type f -print0 | xargs -0 sha256sum > /tmp/after.out
        diff -u /tmp/before.out  /tmp/after.out
        echo "Note that this information has gone nowhere"
